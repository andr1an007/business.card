<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0 viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>Business Card</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

</head>

<body>

    <div class="card">
        <img class="avatar" src="img/avatar.png" alt="">
        <h1>Konovart Andrian</h1>
        <h2>UX/UI Designer • Web Developer</h2>
        <p>I design and develop modern websites, user interfaces, and digital solutions.</p>
        <div class="buttons">
            <a class="btn" href="https://www.instagram.com/adya_man_?igsh=MXhrNmh6ZXphZm8yNw==" target="_blank"
                rel="noopener noreferrer">
                <img class="icon" src="img/insta.png" alt="">
                <span>Instagram</span>
            </a>

            <a class="btn" href="https://www.facebook.com/share/17ndwmMU3x/?mibextid=wwXIfr" target="_blank"
                rel="noopener noreferrer">
                <img class="icon" src="img/facebook.png" alt="">
                <span>Facebook</span>
            </a>

            <a class="btn" href="https://t.me/adya_man" target="_blank" rel="noopener noreferrer">
                <img class="icon" src="img/telega.png" alt="">
                <span>Telegram</span>
            </a>

            <a class="btn"
                href="https://www.linkedin.com/in/andrian-konovart-389931450?utm_source=share&utm_campaign=share_via&utm_content=profile&utm_medium=ios_app"
                target="_blank" rel="noopener noreferrer">
                <img class="icon" src="img/LinkedIn.png" alt="">
                <span>LinkedIn</span>
            </a>
        </div>
    </div>

    <script>
        document.querySelectorAll(".tip-button").forEach(button => {

            button.addEventListener("click", () => {

                if (navigator.vibrate) {
                    navigator.vibrate(15);
                }
            });
        });
    </script>







</body>

</html>
